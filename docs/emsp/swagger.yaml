basePath: /
definitions:
  main.emspReply:
    properties:
      location_count:
        type: integer
      location_ids:
        items:
          type: string
        type: array
      ocpi_reply:
        $ref: '#/definitions/main.ocpiLocationsReply'
      received_from:
        type: string
    type: object
  main.errorReply:
    properties:
      error:
        type: string
    type: object
  main.ocpiLocationsReply:
    properties:
      data:
        items:
          additionalProperties: {}
          type: object
        type: array
      status_code:
        type: integer
      status_message:
        type: string
      timestamp:
        type: string
    type: object
host: localhost:8083
info:
  contact: {}
  description: Fetches charging locations through the OCPI server.
  title: Mock eMSP API
  version: "1.0"
paths:
  /emsp/locations:
    get:
      description: Calls the OCPI server and returns the locations received.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.emspReply'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.errorReply'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/main.errorReply'
      summary: Get locations through the OCPI server
      tags:
      - emsp-locations
swagger: "2.0"
